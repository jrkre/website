  #         cache-dependency-path: react-site/package-lock.json
  #     - run: npm ci
  #     - run: npm test -- --watchAll=false --passWithNoTests

  deploy:
    name: Deploy react-site
    # needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no jrkre@${{ secrets.DEPLOY_HOST }} "cd /home/jrkre/web/website && git pull && cd /home/jrkre/web && podman compose rm -sf react-site; podman compose up --build -d react-site"
